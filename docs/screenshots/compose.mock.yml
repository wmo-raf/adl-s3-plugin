# Extra services merged into the capture stack by
# adl/scripts/capture-plugin-docs.sh, so this plugin's screenshots are taken
# against a real S3-compatible endpoint rather than a live cloud account.
#
# MinIO speaks the same API as AWS S3, so both dispatch channels in
# docs/screenshots/fixture.json point at it: the S3 Upload channel proves the
# generic path and the MinIO Upload channel proves the MinIO-specific
# defaults. Nothing leaves the machine and there is no key to redact.
services:
  mock_s3:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: adl-demo
      MINIO_ROOT_PASSWORD: adl-demo-secret
    networks:
      default:
        aliases:
          # A dotted name, so the endpoint URL is a valid URL to Django's
          # URLField and reads like a real host in captured screens.
          - s3.example.test
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Creates the bucket the channels write into. Runs once and exits; the
  # dispatch cycle in docs_capture_prime happens well after it.
  #
  # It reaches MinIO by the dotted alias, not the service name: mc rejects a
  # hostname containing an underscore ("Invalid Request (invalid hostname)"),
  # so "mock_s3" fails where "s3.example.test" works.
  mock_s3_init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      mock_s3:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set demo http://s3.example.test:9000 adl-demo adl-demo-secret &&
      mc mb --ignore-existing demo/adl-demo &&
      echo '[mock-s3] bucket adl-demo ready'
      "
